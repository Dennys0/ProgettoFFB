name: Java build and tests

on:
  push:
    branches:
      - fix/ui-chapter1-polish
      - feat/chapter3
      - refactor/view-model-cleanup
      - refactor/gameplay-logic-cleanup
      - refactor/state-and-architecture
      - release/consegna-2026-11-04
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and run isolated tests
        run: mvn --batch-mode --no-transfer-progress clean test
